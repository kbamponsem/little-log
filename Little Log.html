<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#4fae7e;--ink:#0f2418;--paper:#e9f6ee;--feed:#f7e9a6;--sleep:#b9c8f5;--diaper:#f6b5c4;--chip:#ffffffaa;--on:#0f2418;--onink:#e9f6ee;
  --disp:'Caprasimo','Cooper Black',Georgia,serif;--body:'Jost','Futura','Century Gothic',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2a1d;--ink:#d6f2e2;--paper:#173a29;--feed:#d9c46a;--sleep:#8fa3e8;--diaper:#e58fa5;--chip:#ffffff22;--on:#0f2418;--onink:#0f2418}}
:root[data-theme="dark"]{--bg:#0f2a1d;--ink:#d6f2e2;--paper:#173a29;--feed:#d9c46a;--sleep:#8fa3e8;--diaper:#e58fa5;--chip:#ffffff22;--on:#0f2418;--onink:#0f2418}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:var(--disp);font-weight:400;font-size:44px;line-height:1;margin:6px 0 4px}
.sub{margin:0 0 18px;font-weight:500;opacity:.8}
.stats{display:flex;gap:8px;margin-bottom:18px}
.stat{flex:1;background:var(--chip);border-radius:18px;padding:10px 12px}
.stat b{display:block;font-family:var(--disp);font-weight:400;font-size:26px}
.stat span{font-size:14px;font-weight:500}
.tiles{display:grid;gap:14px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:16px;min-height:132px;padding:18px 22px;border-radius:34px;color:var(--on);
  box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.tile:focus-visible,.chip:focus-visible,.go:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tile .em{font-size:54px;line-height:1}
.tile .t{font-family:var(--disp);font-size:36px;line-height:1}
.tile .s{display:block;font-size:16px;font-weight:500;margin-top:6px}
.feed{background:var(--feed)}.sleep{background:var(--sleep)}.diaper{background:var(--diaper)}
.sleep.run{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){.sleep.run{animation:none}}
h2{font-family:var(--disp);font-weight:400;font-size:28px;margin:30px 0 10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:20px;padding:12px 14px}
.row .tm{font-weight:600;min-width:52px}
.row .em{font-size:26px}
.row small{display:block;opacity:.75;font-size:14px}
.row img{width:44px;height:44px;border-radius:12px;object-fit:cover;margin-left:auto}
.empty{opacity:.8;padding:12px 4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;top:auto;max-width:560px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:36px 36px 0 0;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;z-index:30}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:32px;margin:0 0 14px}
.grp{margin:14px 0 6px;font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:14px 18px;min-height:52px;border-radius:999px;background:var(--chip);border:3px solid transparent;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.big{flex:1;justify-content:center;min-height:78px;font-size:22px;border-radius:26px;flex-direction:column;gap:2px;text-align:center}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid currentColor}
.step{display:flex;align-items:center;gap:14px}
.step button{all:unset;cursor:pointer;width:64px;height:64px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:34px;text-align:center;line-height:64px}
.step output{font-family:var(--disp);font-size:38px;min-width:130px;text-align:center}
.photo{display:flex;align-items:center;gap:12px}
.photo img{width:64px;height:64px;border-radius:16px;object-fit:cover;display:none}
.go{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;margin-top:22px;padding:22px;text-align:center;border-radius:28px;background:var(--ink);color:var(--paper);font-family:var(--disp);font-size:28px}
.go:active{transform:scale(.98)}
.x{all:unset;cursor:pointer;float:right;font-size:30px;padding:4px 10px}
[hidden]{display:none!important}
.pg{padding-bottom:130px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;max-width:560px;margin:0 auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-radius:28px 28px 0 0;z-index:10}
.tab{all:unset;flex:1;text-align:center;padding:8px 0;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer}
.tab span{display:block;font-size:24px}
.tab[aria-current=page]{background:var(--ink);color:var(--paper)}
.tab:focus-visible,.row:focus-visible,.link:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
button.row{font:inherit;color:inherit;width:100%;border:0;text-align:left;cursor:pointer}
.inp{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:18px;border:3px solid transparent;background:var(--chip);color:var(--ink);resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--paper);border-radius:28px;padding:16px;margin-bottom:14px}
.ch{font-family:var(--disp);font-weight:400;font-size:24px;margin:0 0 10px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}
.daynav b{font-family:var(--disp);font-weight:400;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ph{all:unset;cursor:pointer;display:block;position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px}
.ph small{position:absolute;left:8px;bottom:8px;background:var(--paper);padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.bigph{width:100%;max-height:300px;object-fit:cover;border-radius:22px;margin-bottom:8px}
.del{all:unset;cursor:pointer;display:block;text-align:center;margin-top:12px;padding:16px;font-weight:600;color:#e0554a;width:100%;box-sizing:border-box}
.link{all:unset;cursor:pointer;display:block;margin:16px auto 0;text-align:center;font-weight:600;text-decoration:underline;padding:8px}
.bars{display:flex;gap:6px}
.bc{flex:1;text-align:center;font-size:13px}
.bt{height:90px;display:flex;align-items:flex-end}
.bt i{width:100%;border-radius:10px 10px 4px 4px;min-height:4px}
.bc b{display:block;margin-top:4px}
.cg{display:flex;justify-content:space-between;padding:8px 0;font-weight:500}
.note{opacity:.8;font-size:15px;margin:8px 0 0}
.ic{flex:none;vertical-align:middle}
.tab .ic{display:block;margin:0 auto 2px}
.ch .ic{vertical-align:-4px;margin-right:4px}
.tile .em,.fc .ce{display:flex}
.row .em{display:flex}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{flex-direction:column;justify-content:center;min-height:108px;border-radius:28px;font-size:19px;text-align:center;gap:4px;background:var(--feed);color:var(--on)}
.fc .ce{font-size:40px;line-height:1}
.fc[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<main id="pg-today" class="pg">
  <h1>Little Log</h1>
  <p class="sub" id="today"></p>
  <div class="stats">
    <div class="stat"><b id="sF">0</b><span>feeds</span></div>
    <div class="stat"><b id="sS">0h 0m</b><span>slept</span></div>
    <div class="stat"><b id="sD">0</b><span>diapers</span></div>
  </div>
  <div class="tiles">
    <button class="tile feed" id="bF"><span class="em" data-i="milk" data-s="54"></span><span><span class="t">Feed</span><span class="s" id="lF">No feeds yet</span></span></button>
    <button class="tile sleep" id="bS"><span class="em" data-i="moon" data-s="54"></span><span><span class="t" id="tS">Sleep</span><span class="s" id="lS">Tap when baby falls asleep</span></span></button>
    <button class="tile diaper" id="bD"><span class="em" data-i="droplet" data-s="54"></span><span><span class="t">Diaper</span><span class="s" id="lD">No changes yet</span></span></button>
  </div>
  <h2>Today’s timeline</h2>
  <ul class="log" id="log"></ul>
</main>
<main id="pg-hist" class="pg" hidden>
  <h1>History</h1>
  <div class="daynav"><button class="chip" id="dPrev" aria-label="Previous day" data-i="chevron-left" data-s="22"></button><b id="dLab"></b><button class="chip" id="dNext" aria-label="Next day" data-i="chevron-right" data-s="22"></button></div>
  <div class="chips" id="hf"></div>
  <ul class="log" id="hlog" style="margin-top:14px"></ul>
  <div class="grid" id="hgal" hidden></div>
</main>
<main id="pg-trend" class="pg" hidden></main>
<main id="pg-baby" class="pg" hidden></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Log entry"></section>

<script>
var IC={
'milk':'<path d="M8 2h8"/><path d="M9 2v2.789a4 4 0 0 1-.672 2.219l-.656.984A4 4 0 0 0 7 10.212V20a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-9.789a4 4 0 0 0-.672-2.219l-.656-.984A4 4 0 0 1 15 4.788V2"/><path d="M7 15a6.472 6.472 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/>',
'moon':'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
'droplet':'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
'poop':'<path d="M5 20h14a2 2 0 0 0 0-4H5a2 2 0 0 0 0 4Z"/><path d="M7 16a2 2 0 0 1 0-4h10a2 2 0 0 1 0 4"/><path d="M9 12c0-3 2-4 3-6 1 1.5 3 3 3 6"/>',
'heart':'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
'utensils':'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
'camera':'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
'baby':'<path d="M9 12h.01"/><path d="M15 12h.01"/><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>',
'house':'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
'book-open':'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
'chart-column':'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
'chevron-left':'<path d="m15 18-6-6 6-6"/>',
'chevron-right':'<path d="m9 18 6-6-6-6"/>'};
function ic(n,s){return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'}
var KEY='littlelog.v1',S={logs:[],sleepStart:null},sel={},photo=null,kind=null;
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function hm(t){return new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function dur(ms){var m=Math.round(ms/60000);return Math.floor(m/60)+'h '+(m%60)+'m'}
function ago(t){var m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+'h '+(m%60)+'m ago'}
function isToday(t){return new Date(t).toDateString()===new Date().toDateString()}

var POOP_COL=[['Mustard','#d4a82a'],['Yellow','#e6cf4a'],['Green','#5a7a2a'],['Brown','#6b4423'],['Dark','#2a1a10'],['Pale','#d9d2b8'],['Red-streaked','#a8322d']];
var G={
 feed:[['kind','What kind?',['Breast left','Breast right','Bottle','Solids']]],
 pee:[['shade','Pee colour',['Pale','Normal','Dark']],['amt','How much?',['Small','Medium','Large']]],
 poop:[['col','Poop colour',POOP_COL],['tex','Consistency',['Liquid','Runny','Soft','Pasty','Firm','Hard']],['amt2','How much?',['Small','Medium','Large']]]
};
function chips(key,label,opts,multi){
  return '<div class="grp">'+label+'</div><div class="chips" data-k="'+key+'">'+opts.map(function(o){
    var n=Array.isArray(o)?o[0]:o,c=Array.isArray(o)?o[1]:null;
    return '<button class="chip" aria-pressed="'+(sel[key]===n)+'" data-v="'+n+'">'+(c?'<span class="dot" style="background:'+c+'"></span>':'')+n+'</button>'}).join('')+'</div>';
}
function open(k){
  kind=k;sel={};photo=null;var h='<button class="x" aria-label="Close" id="close">×</button>';
  if(k==='feed'){
    sel.kind='Breast left';sel.n=10;
    h+='<h3>Feeding</h3>'+'<div class="grp">What kind?</div><div class="cards" data-k="kind">'+[['heart','Breast left'],['heart','Breast right'],['milk','Bottle'],['utensils','Solids']].map(function(o){return '<button class="chip fc" aria-pressed="'+(o[1]==='Breast left')+'" data-v="'+o[1]+'"><span class="ce">'+ic(o[0],40)+'</span>'+o[1]+'</button>'}).join('')+'</div>'+
    '<div class="grp" id="nl">Amount</div><div class="step" id="stepper"><button data-d="-1" aria-label="Less">−</button><output id="nv">90 ml</output><button data-d="1" aria-label="More">+</button></div>';
  }else{
    sel.type='Pee';
    h+='<h3>Diaper change</h3><div class="chips" data-k="type">'+[['droplet','Pee'],['poop','Poop'],['droplet poop','Both']].map(function(o){return '<button class="chip big" aria-pressed="'+(o[1]==='Pee')+'" data-v="'+o[1]+'"><span>'+o[0].split(' ').map(function(n){return ic(n,34)}).join('')+'</span>'+o[1]+'</button>'}).join('')+'</div>'+
    '<div id="peeG">'+G.pee.map(function(g){return chips(g[0],g[1],g[2])}).join('')+'</div>'+
    '<div id="poopG" hidden>'+G.poop.map(function(g){return chips(g[0],g[1],g[2])}).join('')+'</div>'+
    '<div class="grp">Photo</div><div class="photo"><label class="chip" tabindex="0">'+ic('camera',22)+' Add photo<input id="file" type="file" accept="image/*" capture="environment" hidden></label><img id="pv" alt="Diaper photo preview"></div>';
  }
  h+='<button class="go" id="go">Log '+(k==='feed'?'feeding':'change')+' now</button>';
  $('sheet').innerHTML=h;$('scrim').classList.add('open');$('sheet').classList.add('open');
  sync();
}
function sync(){
  if(kind==='feed'){
    var b=sel.kind==='Bottle',br=sel.kind&&sel.kind.indexOf('Breast')===0;
    $('stepper').hidden=!(b||br);$('nl').hidden=!(b||br);
    if(b&&sel.u!=='ml'){sel.u='ml';sel.n=90}
    if(br&&sel.u!=='min'){sel.u='min';sel.n=10}
    $('nl').textContent=b?'Amount':'Minutes';$('nv').textContent=sel.n+' '+sel.u;
  }else{
    $('peeG').hidden=sel.type==='Poop';$('poopG').hidden=sel.type==='Pee';
  }
}
function close(){$('scrim').classList.remove('open');$('sheet').classList.remove('open')}
$('scrim').onclick=close;
$('sheet').addEventListener('click',function(e){
  var t=e.target.closest('button,label');if(!t)return;
  if(t.id==='close')return close();
  if(t.id==='go')return commit();
  if(t.dataset.d){sel.n=Math.max(0,sel.n+(+t.dataset.d)*(sel.u==='ml'?10:1));return sync()}
  var g=t.parentNode.dataset&&t.parentNode.dataset.k;
  if(g&&t.dataset.v){
    sel[g]=(sel[g]===t.dataset.v&&g!=='type'&&g!=='kind')?null:t.dataset.v;
    [].forEach.call(t.parentNode.children,function(c){c.setAttribute('aria-pressed',String(sel[g]===c.dataset.v))});
    sync();
  }
});
$('sheet').addEventListener('change',function(e){
  if(e.target.id!=='file'||!e.target.files[0])return;
  var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
    var c=document.createElement('canvas'),s=240/Math.max(im.width,im.height);c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.6);
    var pv=$('pv');pv.src=photo;pv.style.display='block'};im.src=r.result};r.readAsDataURL(e.target.files[0]);
});
function commit(){
  var e={id:Date.now(),t:Date.now()};
  if(kind==='feed'){e.type='feed';e.what=sel.kind;e.amt=sel.n?sel.n+' '+sel.u:''}
  else{
    e.type='diaper';e.what=sel.type;var d=[];
    if(sel.type!=='Poop'){['shade','amt'].forEach(function(k){if(sel[k])d.push(sel[k])});if(sel.shade||sel.amt)d[0]='Pee: '+d[0]}
    if(sel.type!=='Pee'){var p=['col','tex','amt2'].map(function(k){return sel[k]}).filter(Boolean);if(p.length)d.push('Poop: '+p.join(', '))}
    e.amt=d.join(' · ');if(photo)e.photo=photo;
  }
  S.logs.unshift(e);save();close();render();
}
function toggleSleep(){
  if(S.sleepStart){S.logs.unshift({id:Date.now(),t:S.sleepStart,type:'sleep',end:Date.now()});S.sleepStart=null}
  else S.sleepStart=Date.now();
  save();render();
}
function last(type){return S.logs.filter(function(l){return l.type===type})[0]}
function render(){
  $('today').textContent=new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});
  var td=S.logs.filter(function(l){return isToday(l.t)});
  var sl=td.filter(function(l){return l.type==='sleep'}).reduce(function(a,l){return a+(l.end-l.t)},0);
  $('sF').textContent=td.filter(function(l){return l.type==='feed'}).length;
  $('sD').textContent=td.filter(function(l){return l.type==='diaper'}).length;
  $('sS').textContent=dur(sl);
  var f=last('feed'),d=last('diaper');
  $('lF').textContent=f?'Last: '+ago(f.t):'No feeds yet';
  $('lD').textContent=d?'Last: '+ago(d.t):'No changes yet';
  var run=!!S.sleepStart;$('bS').classList.toggle('run',run);
  $('tS').textContent=run?'Wake up':'Sleep';
  $('lS').textContent=run?'Asleep for '+dur(Date.now()-S.sleepStart):'Tap when baby falls asleep';
  var em={feed:'🍼',sleep:'🌙',diaper:'💧'};
  $('log').innerHTML=td.length?td.map(function(l){
    var title=l.type==='sleep'?'Slept '+dur(l.end-l.t):l.what,det=l.type==='sleep'?hm(l.t)+' to '+hm(l.end):l.amt;
    return '<li class="row"><span class="tm">'+hm(l.t)+'</span><span class="em">'+(l.type==='diaper'&&l.what!=='Pee'?'💩':em[l.type])+'</span><span><b>'+title+'</b>'+(det?'<small>'+det+'</small>':'')+'</span>'+(l.photo?'<img alt="Diaper photo" src="'+l.photo+'">':'')+'</li>'}).join('')
    :'<li class="empty">Nothing logged yet today. Tap a big button to start.</li>';
}

<script>
var tab='today',hd=new Date(),filt='all',dId=null,TABS=[['today','house','Today'],['hist','book-open','History'],['trend','chart-column','Trends'],['baby','baby','Baby']];
S.baby=S.baby||{name:'Baby',born:'',theme:'auto'};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tv(t){var d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function setT(b,v){var d=new Date(b),p=(v||'0:0').split(':');d.setHours(+p[0],+p[1],0,0);return d.getTime()}
function ageStr(s){var d=Math.floor((Date.now()-new Date(s))/864e5);return d<0?'':d<14?d+' days old':d<84?Math.floor(d/7)+' weeks old':Math.floor(d/30.4)+' months old'}
function theme(){var t=S.baby.theme;if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}

 return '<li><button class="row" data-id="'+l.id+'"><span class="tm">'+hm(l.t)+'</span><span class="em">'+ik+'</span><span><b>'+esc(t)+'</b>'+(d?'<small>'+esc(d)+'</small>':'')+(l.note?'<small>“'+esc(l.note)+'”</small>':'')+'</span>'+(l.photo?'<img alt="Diaper photo" src="'+l.photo+'">':'')+'</button></li>'}
var _r=render;render=function(){_r();head();var td=S.logs.filter(function(l){return isToday(l.t)});$('log').innerHTML=td.length?td.map(rowH).join(''):'<li class="empty">Nothing logged yet today. Tap a big button to start.</li>'};

function go(t){tab=t;TABS.forEach(function(x){$('pg-'+x[0]).hidden=x[0]!==t});[].forEach.call($('tabs').children,function(c){if(c.dataset.t===t)c.setAttribute('aria-current','page');else c.removeAttribute('aria-current')});draw();scrollTo(0,0)}

/* sheets: extras, sleep, detail */
function show(){$('scrim').classList.add('open');$('sheet').classList.add('open')}
function extras(){return '<div class="grp">When</div><input class="inp" type="time" id="when" value="'+tv(Date.now())+'"><div class="grp">Notes</div><textarea class="inp" id="note" rows="2" placeholder="Anything worth remembering?"></textarea>'}
var _o=open;open=function(k){_o(k);$('go').insertAdjacentHTML('beforebegin',extras())};
var _s=sync;sync=function(){if(kind==='feed'||kind==='diaper')_s()};
function sleepSheet(){kind='sleep';sel={};var live=!!S.sleepStart,st=S.sleepStart||Date.now()-18e5;
 $('sheet').innerHTML='<button class="x" id="close" aria-label="Close">×</button><h3>'+(live?'Baby woke up':'Log a past nap')+'</h3><div class="two"><div><div class="grp">Fell asleep</div><input class="inp" type="time" id="t1" value="'+tv(st)+'"></div><div><div class="grp">Woke up</div><input class="inp" type="time" id="t2" value="'+tv(Date.now())+'"></div></div>'+chips('where','Where did they sleep?',['Crib','Arms','Stroller','Car','Parents’ bed'])+chips('mood','Waking mood',['Calm','Fussy','Cried'])+'<div class="grp">Notes</div><textarea class="inp" id="note" rows="2"></textarea><button class="go" id="go">Save nap</button>';show()}
var _c=commit;commit=function(){
 var w=$('when')?setT(Date.now(),$('when').value):Date.now(),n=$('note')?$('note').value.trim():'';
 if(kind==='sleep'){var s=setT(S.sleepStart||Date.now(),$('t1').value),e=setT(Date.now(),$('t2').value);if(e<=s)s-=864e5;
  var l={id:Date.now(),t:s,type:'sleep',end:e};if(sel.where)l.where=sel.where;if(sel.mood)l.mood=sel.mood;if(n)l.note=n;S.logs.push(l);S.sleepStart=null}
 else{_c();var x=S.logs[0];x.t=w;if(n)x.note=n}
 S.logs.sort(function(a,b){return b.t-a.t});save();close();refresh()};
$('bS').onclick=function(){if(S.sleepStart)sleepSheet();else{S.sleepStart=Date.now();save();refresh()}};
document.querySelector('.tiles').insertAdjacentHTML('afterend','<button class="link" id="past">Log a past nap</button>');
$('past').onclick=function(){S.sleepStart?sleepSheet():sleepSheet()};
function detail(id){var l=S.logs.find(function(x){return x.id===id});if(!l)return;kind='detail';dId=id;sel={};
 var sl=l.type==='sleep',h='<button class="x" id="close" aria-label="Close">×</button><h3>'+(sl?'Nap':l.type==='feed'?'Feeding':'Diaper change')+'</h3>';
 if(l.photo)h+='<img class="bigph" alt="Diaper photo" src="'+l.photo+'">';
 h+='<p><b>'+esc(sl?'Slept '+dur(l.end-l.t):l.what)+'</b><br>'+esc(sl?[l.where,l.mood].filter(Boolean).join(' · '):l.amt||'')+'</p>';
 h+=sl?'<div class="two"><div><div class="grp">Fell asleep</div><input class="inp" type="time" id="t1" value="'+tv(l.t)+'"></div><div><div class="grp">Woke up</div><input class="inp" type="time" id="t2" value="'+tv(l.end)+'"></div></div>':'<div class="grp">Time</div><input class="inp" type="time" id="t1" value="'+tv(l.t)+'">';
 h+='<div class="grp">Notes</div><textarea class="inp" id="note" rows="2">'+esc(l.note||'')+'</textarea><button class="go" id="sv">Save changes</button><button class="del" id="del">Delete entry</button>';
 $('sheet').innerHTML=h;show()}
$('sheet').addEventListener('click',function(e){var t=e.target.closest('button');if(!t||kind!=='detail')return;var l=S.logs.find(function(x){return x.id===dId});if(!l)return;
 if(t.id==='del'){S.logs=S.logs.filter(function(x){return x!==l});save();close();refresh()}
 if(t.id==='sv'){l.t=setT(l.t,$('t1').value);if(l.type==='sleep'){l.end=setT(l.end,$('t2').value);if(l.end<=l.t)l.end+=864e5}l.note=$('note').value.trim();S.logs.sort(function(a,b){return b.t-a.t});save();close();refresh()}});
document.addEventListener('click',function(e){var r=e.target.closest('.row,.ph');if(r&&r.dataset.id)detail(+r.dataset.id)});
/* history */
function hist(){var s=new Date(hd);s.setHours(0,0,0,0);var a=s.getTime(),b=a+864e5;
 $('dLab').textContent=s.toDateString()===new Date().toDateString()?'Today':s.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
 $('hf').innerHTML=[['all','All'],['feed',ic('milk',18)+' Feeds'],['sleep',ic('moon',18)+' Sleep'],['diaper',ic('droplet',18)+' Diapers'],['photo',ic('camera',18)+' Photos']].map(function(f){return '<button class="chip" data-f="'+f[0]+'" aria-pressed="'+(filt===f[0])+'">'+f[1]+'</button>'}).join('');
 var L=S.logs.filter(function(l){return l.t>=a&&l.t<b&&(filt==='all'||filt==='photo'||l.type===filt)}),P=S.logs.filter(function(l){return l.photo});
 $('hgal').hidden=filt!=='photo';$('hlog').hidden=filt==='photo';
 $('hgal').innerHTML=P.length?P.map(function(l){return '<button class="ph" data-id="'+l.id+'"><img alt="Diaper photo" src="'+l.photo+'"><small>'+new Date(l.t).toLocaleDateString([], {month:'short',day:'numeric'})+'</small></button>'}).join(''):'<p class="empty" style="grid-column:1/-1">No photos yet. Add one when you log a diaper.</p>';
 $('hlog').innerHTML=L.length?L.map(rowH).join(''):'<li class="empty">Nothing logged this day.</li>'}
$('hf').onclick=function(e){var c=e.target.closest('.chip');if(c){filt=c.dataset.f;hist()}};
$('dPrev').onclick=function(){hd.setDate(hd.getDate()-1);hist()};
$('dNext').onclick=function(){if(hd.toDateString()!==new Date().toDateString()){hd.setDate(hd.getDate()+1);hist()}};
/* trends */
function trends(){var days=[0,1,2,3,4,5,6].map(function(i){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-6+i);return d.getTime()});
 function by(fn){return days.map(function(s){return fn(S.logs.filter(function(l){return l.t>=s&&l.t<s+864e5}))})}
 var F=by(function(a){return a.filter(function(l){return l.type==='feed'}).length}),Z=by(function(a){return a.filter(function(l){return l.type==='sleep'}).reduce(function(x,l){return x+(l.end-l.t)},0)/36e5}),D=by(function(a){return a.filter(function(l){return l.type==='diaper'}).length});
 function ch(t,v,c,f){var m=Math.max.apply(null,v.concat(1));return '<section class="card"><h2 class="ch">'+t+'</h2><div class="bars">'+v.map(function(x,i){return '<div class="bc"><div class="bt"><i style="height:'+(x/m*100)+'%;background:'+c+'"></i></div><b>'+(f?x.toFixed(1):x)+'</b>'+new Date(days[i]).toLocaleDateString([], {weekday:'narrow'})+'</div>'}).join('')+'</div></section>'}
 var fe=S.logs.filter(function(l){return l.type==='feed'&&l.t>=days[0]}).map(function(l){return l.t}).sort(function(a,b){return a-b}),gap=fe.length>1?dur((fe[fe.length-1]-fe[0])/(fe.length-1)):'Not enough data',cnt={};
 S.logs.filter(function(l){return l.type==='diaper'&&l.t>=days[0]&&l.amt}).forEach(function(l){var m=/Poop: ([A-Za-z-]+)/.exec(l.amt);if(m&&POOP_COL.some(function(c){return c[0]===m[1]}))cnt[m[1]]=(cnt[m[1]]||0)+1});
 var flag=cnt['Red-streaked']||cnt.Dark||cnt.Pale;
 $('pg-trend').innerHTML='<h1>Trends</h1><p class="sub">Last 7 days</p><section class="card"><h2 class="ch">Time between feeds</h2><b style="font-family:var(--disp);font-weight:400;font-size:32px">'+gap+'</b><small class="note" style="display:block">on average</small></section>'+ch(ic('milk',22)+' Feeds per day',F,'var(--feed)')+ch(ic('moon',22)+' Hours slept per day',Z,'var(--sleep)',1)+ch(ic('droplet',22)+' Diapers per day',D,'var(--diaper)')+'<section class="card"><h2 class="ch">Poop colours</h2><div class="chips">'+(Object.keys(cnt).length?Object.keys(cnt).map(function(k){var c=POOP_COL.filter(function(x){return x[0]===k})[0];return '<span class="chip"><span class="dot" style="background:'+c[1]+'"></span>'+k+' ×'+cnt[k]+'</span>'}).join(''):'<span class="note">No poop colours logged yet.</span>')+'</div>'+(flag?'<p class="note">Red, black or pale stools are worth mentioning to your pediatrician.</p>':'')+'</section>'}
/* baby */
function baby(){var b=S.baby;
 $('pg-baby').innerHTML='<h1>Baby</h1><section class="card"><div class="grp" style="margin-top:0">Name</div><input class="inp" id="bn" value="'+esc(b.name)+'"><div class="grp">Birthday</div><input class="inp" type="date" id="bb" value="'+b.born+'"></section>'
 +'<section class="card"><h2 class="ch">Caregivers</h2><div class="cg"><span>You</span><span>Owner</span></div><div class="cg"><span>Partner</span><span>Co-parent · edit all</span></div><div class="cg"><span>Grandma</span><span>View and add</span></div><button class="chip" id="inv" style="margin-top:8px">Copy invite link</button></section>'
 +'<section class="card"><h2 class="ch">Appearance</h2><div class="chips">'+[['auto','Auto'],['light','Light'],['dark','Dark']].map(function(t){return '<button class="chip" data-th="'+t[0]+'" aria-pressed="'+(b.theme===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></section>'
 +'<section class="card"><h2 class="ch">Your data</h2><div class="chips"><button class="chip" id="exp">Copy as CSV</button><button class="chip" id="clr">Delete everything</button></div><p class="note">Saved on this device only in this sample.</p></section>'}
$('pg-baby').addEventListener('input',function(e){if(e.target.id==='bn')S.baby.name=e.target.value;if(e.target.id==='bb')S.baby.born=e.target.value;save();head()});
$('pg-baby').addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.dataset.th){S.baby.theme=t.dataset.th;theme();save();baby()}
 if(t.id==='inv'||t.id==='exp'){var txt=t.id==='inv'?location.href:'time,type,what,details,notes\n'+S.logs.map(function(l){return [new Date(l.t).toISOString(),l.type,l.what||'Sleep',l.type==='sleep'?dur(l.end-l.t):l.amt||'',l.note||''].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');try{navigator.clipboard.writeText(txt)}catch(x){}t.textContent='Copied ✓'}

[].forEach.call(document.querySelectorAll('[data-i]'),function(e){e.innerHTML=ic(e.dataset.i,+e.dataset.s||24)});
